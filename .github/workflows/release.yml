name: Build release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "0.0.${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Oucx.Reader.csproj

      - name: Publish Windows x64
        run: >-
          dotnet publish Oucx.Reader.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:Version=${{ steps.version.outputs.version }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify single-executable output
        shell: pwsh
        run: |
          Remove-Item publish\*.xml, publish\*.pdb -Force -ErrorAction SilentlyContinue
          $files = @(Get-ChildItem publish -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "Oucx.Reader.exe") {
            throw "Expected only Oucx.Reader.exe in the publish directory; found: $($files.Name -join ', ')"
          }

      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath Oucx.Reader-win-x64.zip
          $packageHash = (Get-FileHash Oucx.Reader-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$packageHash  Oucx.Reader-win-x64.zip" | Set-Content Oucx.Reader-win-x64.zip.sha256 -NoNewline
          $executableHash = (Get-FileHash publish\Oucx.Reader.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$executableHash  Oucx.Reader.exe" | Set-Content Oucx.Reader.exe.sha256 -NoNewline

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Oucx.Reader-win-x64
          path: |
            publish/Oucx.Reader.exe
            Oucx.Reader.exe.sha256
            Oucx.Reader-win-x64.zip
            Oucx.Reader-win-x64.zip.sha256

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            publish/Oucx.Reader.exe
            Oucx.Reader.exe.sha256
            Oucx.Reader-win-x64.zip
            Oucx.Reader-win-x64.zip.sha256
